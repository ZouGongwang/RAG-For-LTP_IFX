# BSP/IFX RAG configuration.
# Any value can be overridden with an environment variable: RAG_<SECTION>__<KEY>,

device: auto            
log_level: INFO

paths:
  data_dir: data                # index, sync state, caption cache
  models_dir: data/models       # Hugging Face / Docling model cache (copyable to offline machines)

sources:
  local:
    enabled: true
    path: documents
  confluence_api:
    enabled: true
    deployment: datacenter      # datacenter (self-hosted) | cloud (*.atlassian.net)
    spaces: [BEBSP]             
    include_attachments: true
    max_attachment_mb: 200
    verify_ssl: true
    page_limit: 50
  confluence_export:
    enabled: false
    path: data/confluence_export   # unzipped HTML or Markdown space export
    space: ""

parsing:
  backend: docling              # docling (layout, tables, OCR) | simple (lightweight fallback)
  ocr: true
  table_structure: true
  describe_images: true         # caption figures/diagrams with the vision model
  describe_low_text_pages: true # caption PDF pages that are mostly graphics
  low_text_threshold: 100       # characters per page
  min_image_px: 120             # ignore icons/logos smaller than this
  image_scale: 2.0
  docling_artifacts_path: null  # folder with pre-downloaded Docling models (offline use)

chunking:
  max_tokens: 400
  overlap_ratio: 0.15
  min_tokens: 25

embedding:
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 32

vectorstore:
  collection: bsp_docs

retrieval:
  dense_k: 20
  bm25_k: 20
  top_k: 5
  rrf_k: 60
  rerank:
    enabled: false
    model: cross-encoder/ms-marco-MiniLM-L-6-v2
    candidates: 20

prompt:
  template: answer.md
  max_context_chars: 12000
  display_sources: 3
  history_turns: 6              # earlier question/answer pairs remembered within a chat (0 = no memory)
  history_chars: 1500

llm:
  provider: openai_compat       # ollama | openai_compat | mcp
  ollama:                       
    model: deepseek-r1:8b
    host: http://localhost:11434
    temperature: 0.1
    num_ctx: 8192
  openai_compat:                # company LiteLLM gateway (OpenAI-compatible)
    base_url: "https://litellm.icp.infineon.com/v1"   # LITELLM_API_BASE from the IT doc + /v1
    model: "gpt-5"              # or claude-sonnet-4.6 — must match the gateway model id
    api_key_env: LLM_API_KEY
    temperature: null           # null = model default; dropped automatically if a model rejects it
    timeout_s: 120
  mcp:                          # if IT exposes the cloud LLM as an MCP tool; run `rag mcp-tools`
    transport: streamable_http  # streamable_http | sse | stdio
    url: ""
    auth_token_env: MCP_AUTH_TOKEN
    tool_name: generate
    argument_style: prompt      
    prompt_arg: prompt
    system_arg: null
    messages_arg: messages
    extra_args: {}

vision:
  enabled: true
  provider: openai_compat       # same gateway; uses multimodal chat (image_url)
  ollama:                       # local fallback: set provider: ollama
    model: llava:7b
    host: http://localhost:11434
    timeout_s: 300
  openai_compat:                # empty fields reuse llm.openai_compat (same gateway, key, model)
    model: ""                   # set e.g. claude-sonnet-4.6 to caption with a different model
    timeout_s: 120

api:
  host: 127.0.0.1
  port: 8000
  cors_origins:
    - https://confluencewikiprod.intra.infineon.com
