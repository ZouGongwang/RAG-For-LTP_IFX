<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BSP assistant</title>
<style>
  :root {
    --ink: #14222b;
    --muted: #5c6b76;
    --line: #d7dee4;
    --panel: #ffffff;
    --wash: #f3f6f8;
    --accent: #0c4a5e;
    --accent-2: #14627a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font: 15px/1.45 "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background: var(--wash);
  }
  .page {
    max-width: 36rem;
    margin: 0 auto;
    padding: 4.5rem 1.5rem;
  }
  h1 { font-size: 1.45rem; font-weight: 650; margin: 0 0 0.6rem; }
  p { color: var(--muted); margin: 0; }

  #bsp-launcher, #bsp-panel { font: inherit; }
  #bsp-launcher {
    position: fixed;
    right: 1.25rem;
    bottom: 1.25rem;
    z-index: 20;
    width: 3.5rem;
    height: 3.5rem;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: white;
    box-shadow: 0 8px 24px rgba(12, 74, 94, 0.28);
    cursor: pointer;
  }
  #bsp-launcher:hover { background: var(--accent-2); }
  #bsp-launcher svg { width: 1.5rem; height: 1.5rem; display: block; margin: 0 auto; }

  #bsp-panel {
    position: fixed;
    right: 1.25rem;
    bottom: 5.4rem;
    z-index: 20;
    width: min(24rem, calc(100vw - 2rem));
    height: min(34rem, calc(100vh - 7.5rem));
    display: flex;
    flex-direction: column;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(20, 34, 43, 0.18);
    overflow: hidden;
  }
  #bsp-panel[hidden] { display: none; }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    padding: 0.75rem 0.85rem;
    background: var(--accent);
    color: white;
  }
  header strong { display: block; font-size: 0.95rem; }
  header span { display: block; font-size: 0.75rem; opacity: 0.85; font-weight: 400; }
  #bsp-close {
    border: 0;
    background: transparent;
    color: white;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    padding: 0.2rem 0.35rem;
  }
  #bsp-log {
    flex: 1;
    overflow: auto;
    padding: 0.85rem;
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
    background: var(--wash);
  }
  .msg { max-width: 92%; padding: 0.55rem 0.7rem; border-radius: 10px; white-space: pre-wrap; }
  .msg.you { align-self: flex-end; background: var(--accent); color: white; }
  .msg.bot { align-self: flex-start; background: white; border: 1px solid var(--line); }
  .msg.pending { color: var(--muted); }
  .sources { margin: 0.45rem 0 0; padding: 0; list-style: none; font-size: 0.78rem; }
  .sources a { color: var(--accent-2); }
  form {
    display: flex;
    gap: 0.45rem;
    padding: 0.7rem;
    border-top: 1px solid var(--line);
    background: white;
  }
  textarea {
    flex: 1;
    resize: none;
    height: 2.7rem;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.6rem;
    font: inherit;
  }
  form button {
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    padding: 0 0.9rem;
    font: inherit;
    cursor: pointer;
  }
  form button:disabled { opacity: 0.55; cursor: default; }
</style>
</head>
<body>
  <main class="page">
    <h1>BSP assistant</h1>
    <p>Ask about the indexed Confluence pages and documents. Use the button in the bottom-right corner. Each question is answered on its own, so include the topic in the question.</p>
  </main>

  <button id="bsp-launcher" type="button" aria-expanded="false" aria-controls="bsp-panel" aria-label="Open assistant">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h7A3.5 3.5 0 0 1 19 6.5v6A3.5 3.5 0 0 1 15.5 16H9l-4 3.5V6.5z"/>
    </svg>
  </button>

  <section id="bsp-panel" hidden>
    <header>
      <div>
        <strong>BSP assistant</strong>
        <span>Answers from indexed pages</span>
      </div>
      <button id="bsp-close" type="button" aria-label="Close">×</button>
    </header>
    <div id="bsp-log"></div>
    <form id="bsp-form">
      <textarea id="bsp-input" placeholder="Ask a question…" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <script>
    const launcher = document.getElementById("bsp-launcher");
    const panel = document.getElementById("bsp-panel");
    const log = document.getElementById("bsp-log");
    const form = document.getElementById("bsp-form");
    const input = document.getElementById("bsp-input");

    function setOpen(open) {
      panel.hidden = !open;
      launcher.setAttribute("aria-expanded", String(open));
      launcher.setAttribute("aria-label", open ? "Close assistant" : "Open assistant");
      if (open) input.focus();
    }

    launcher.addEventListener("click", () => setOpen(panel.hidden));
    document.getElementById("bsp-close").addEventListener("click", () => setOpen(false));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") setOpen(false);
    });

    function addMessage(role, text) {
      const el = document.createElement("div");
      el.className = "msg " + role;
      el.textContent = text;
      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
      return el;
    }

    function renderAnswer(data) {
      const el = document.createElement("div");
      el.className = "msg bot";
      const body = document.createElement("div");
      body.textContent = data.answer || "(empty answer)";
      el.appendChild(body);
      const sources = data.sources || [];
      if (sources.length) {
        const list = document.createElement("ul");
        list.className = "sources";
        for (const source of sources) {
          const item = document.createElement("li");
          const label = source.label || source.title || "Source";
          if (source.url) {
            const link = document.createElement("a");
            link.href = source.url;
            link.target = "_blank";
            link.rel = "noopener";
            link.textContent = label;
            item.appendChild(link);
          } else {
            item.textContent = label;
          }
          list.appendChild(item);
        }
        el.appendChild(list);
      }
      return el;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;
      input.value = "";
      addMessage("you", question);
      const pending = addMessage("bot pending", "Looking through the indexed pages…");
      form.querySelector("button").disabled = true;
      try {
        const resp = await fetch("/query", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          const detail = data.detail;
          throw new Error(typeof detail === "string" ? detail : resp.statusText);
        }
        pending.replaceWith(renderAnswer(data));
      } catch (err) {
        pending.classList.remove("pending");
        pending.textContent = "Could not get an answer. " + err.message;
      } finally {
        form.querySelector("button").disabled = false;
        input.focus();
        log.scrollTop = log.scrollHeight;
      }
    });
  </script>
</body>
</html>
